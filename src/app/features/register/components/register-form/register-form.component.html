<form action="">
  <div class="h-full py-6 px-14">
    <div class="text-neutral-900 font-semibold text-2xl py-4">
      <div>Crea una cuenta</div>
      <div class="text-sm font-thin">
        Registrate para acceder a todas las funciones
      </div>
    </div>
    <div class="py-4">
      <app-input-component
        label="Nombre"
        placeholder="Ingresa tu nombre"
        [type]="inputType.TEXT"
        [isRequired]="true"
        class=""
      />
      <app-input-component
        label="Nombre de usuario"
        placeholder="Ingresa tu nombre de usuario"
        [type]="inputType.TEXT"
        [isRequired]="true"
        class="my-2"
      />
      <app-input-component
        label="Email"
        placeholder="Ingresa tu email"
        [type]="inputType.EMAIL"
        [isRequired]="true"
        class="my-2"
      />
      <app-input-component
        label="Teléfono"
        placeholder="Ingresa tu teléfono"
        [type]="inputType.TEXT"
        [isRequired]="true"
        class="my-2"
      />
      <app-input-component
        label="Contraseña"
        placeholder="Ingresa tu contraseña"
        [type]="inputType.PASSWORD"
        [isRequired]="true"
        class="my-2"
      />
    </div>
    <app-button-component label="Registrarse" />
  </div>
</form>
