<app-page-header title="Appointments">
  <app-date-range-picker titleAccessory [from]="dateFrom()" [to]="dateTo()" (rangeChange)="setDateRange($event)" />
</app-page-header>

@switch (loadState()) {
  @case ('loading') {
    <div class="flex min-h-0 flex-1 gap-5 overflow-x-auto pb-4">
      @for (def of columns(); track def.id) {
        <div class="glass-panel flex w-80 shrink-0 flex-col gap-3.5 rounded-3xl p-4">
          @for (i of [1, 2]; track i) {
            <div class="glass-card h-24 animate-pulse rounded-2xl"></div>
          }
        </div>
      }
    </div>
  }
  @case ('error') {
    <div class="flex flex-1 flex-col items-center justify-center gap-3">
      <p class="text-sm font-medium text-gray-500">No se pudieron cargar las citas.</p>
      <button
        type="button"
        (click)="load()"
        class="rounded-2xl bg-primary px-5 py-2.5 text-sm font-bold text-white shadow-lg shadow-primary/30 transition-colors hover:bg-primary/90"
      >
        Reintentar
      </button>
    </div>
  }
  @case ('ready') {
    <div cdkDropListGroup class="flex min-h-0 flex-1 gap-5 overflow-x-auto pb-4">
      @for (column of columns(); track column.id) {
        <app-board-column
          [column]="column"
          [enterPredicate]="canEnter"
          (dropped)="drop($event)"
          (cardClick)="openDetail($event)"
        />
      }
    </div>
  }
}
