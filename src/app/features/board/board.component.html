<div class="mb-7 flex shrink-0 flex-wrap items-center justify-between gap-4">
  <div>
    <h1 class="text-[34px] font-extrabold tracking-tight text-gray-900">Appointments</h1>
    <p class="text-[15px] font-medium text-gray-500">Today, Oct 24th</p>
  </div>

  <div class="glass-panel flex items-center gap-1 rounded-2xl p-1.5">
    @for (workflow of workflows; track workflow.id) {
      <button
        type="button"
        (click)="selectWorkflow(workflow.id)"
        class="whitespace-nowrap rounded-xl px-4 py-2.5 text-sm font-semibold transition-colors {{
          workflow.id === selectedWorkflowId() ? 'bg-white/95 text-primary shadow-md' : 'text-gray-500 hover:text-gray-700'
        }}"
      >
        {{ workflow.name }}
      </button>
    }
  </div>
</div>

<div cdkDropListGroup class="flex min-h-0 flex-1 gap-5 overflow-x-auto pb-4">
  @for (column of columns(); track column.id) {
    <app-board-column [column]="column" (dropped)="drop($event)" />
  }
</div>
