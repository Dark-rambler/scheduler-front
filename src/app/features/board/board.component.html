<div class="mb-6 flex shrink-0 flex-wrap items-center justify-between gap-3">
  <div>
    <h1 class="text-2xl font-bold text-gray-900">Appointments</h1>
    <p class="text-sm text-gray-500">Today, Oct 24th</p>
  </div>

  <div class="flex items-center gap-1 rounded-lg bg-gray-100 p-1">
    @for (workflow of workflows; track workflow.id) {
      <button
        type="button"
        (click)="selectWorkflow(workflow.id)"
        class="rounded-md px-3 py-1.5 text-sm font-medium transition-colors {{
          workflow.id === selectedWorkflowId() ? 'bg-white text-primary shadow-sm' : 'text-gray-500 hover:text-gray-700'
        }}"
      >
        {{ workflow.name }}
      </button>
    }
  </div>
</div>

<div cdkDropListGroup class="flex min-h-0 flex-1 gap-4 overflow-x-auto pb-4">
  @for (column of columns(); track column.id) {
    <app-board-column [column]="column" (dropped)="drop($event)" />
  }
</div>
