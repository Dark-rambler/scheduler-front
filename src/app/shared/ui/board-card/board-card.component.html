<div class="glass-card cursor-grab rounded-2xl p-[18px] active:cursor-grabbing">
  <div class="mb-2 flex items-start justify-between gap-2.5">
    <p class="text-[16.5px] font-bold leading-tight text-gray-900">{{ appointment().patientName }}</p>
    <app-badge [tone]="priorityTone[appointment().priority]" [variant]="priorityVariant[appointment().priority]">
      {{ priorityLabel[appointment().priority] }}
    </app-badge>
  </div>

  <p class="mb-3 text-sm font-medium leading-snug text-gray-500">{{ appointment().reason }}</p>

  <div class="flex flex-wrap items-center gap-x-2 gap-y-1 text-[13.5px] font-medium text-gray-500">
    @if (appointment().time) {
      <span class="inline-flex items-center gap-1.5">
        <svg class="h-[15px] w-[15px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3.2 2" />
        </svg>
        {{ appointment().time }}
      </span>
    }
    @if (appointment().waitMinutes) {
      <span class="font-bold text-red-600">Wait: {{ appointment().waitMinutes }}m</span>
    }
    @if (appointment().doctor) {
      <span class="inline-flex items-center gap-1.5">
        <svg class="h-[15px] w-[15px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.2" /><path d="M5.5 20a6.5 6.5 0 0 1 13 0" />
        </svg>
        {{ appointment().doctor }}
      </span>
    }
  </div>
</div>
