<button
  type="button"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  [disabled]="disabled()"
  (click)="toggle()"
  [attr.aria-label]="label()"
  class="flex w-full items-center gap-2 rounded-2xl border border-gray-900/10 bg-gray-900/[0.04] px-3 py-2 text-left text-sm font-semibold text-gray-700 shadow-[inset_0_1px_3px_rgba(0,0,0,0.08)] transition-colors hover:bg-gray-900/[0.07] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/30 disabled:pointer-events-none disabled:opacity-40 {{ isOpen() ? 'border-primary/40 bg-white ring-2 ring-primary/30' : '' }}"
>
  <svg class="h-4 w-4 shrink-0 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM12 7v5l3 2" />
  </svg>
  <span class="flex-1 whitespace-nowrap">{{ display() }}</span>
  <svg class="h-3.5 w-3.5 shrink-0 text-gray-400 transition-transform {{ isOpen() ? 'rotate-180' : '' }}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
    <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
  </svg>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayPositions]="positions"
  (overlayOutsideClick)="close()"
  (attach)="revealSelected()"
  (detach)="close()"
>
  <div class="glass-modal max-h-64 w-36 overflow-y-auto rounded-2xl p-1.5" role="listbox" [attr.aria-label]="label()">
    @for (option of options; track option.value) {
      <button
        type="button"
        role="option"
        [attr.aria-selected]="option.value === value()"
        [attr.data-selected]="option.value === value() || null"
        (click)="pick(option.value)"
        class="flex w-full items-center rounded-xl px-3 py-1.5 text-left text-[13px] font-semibold transition-colors {{
          option.value === value() ? 'bg-primary text-white' : 'text-gray-700 hover:bg-white/70'
        }}"
      >
        {{ option.label }}
      </button>
    }
  </div>
</ng-template>
