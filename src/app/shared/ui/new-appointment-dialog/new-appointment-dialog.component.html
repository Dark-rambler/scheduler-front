<div class="w-96 rounded-xl bg-white p-5 shadow-xl">
  <div class="mb-1 flex items-center justify-between">
    <h2 class="text-lg font-semibold text-gray-900">New Appointment</h2>
    <button type="button" (click)="close()" class="text-gray-400 hover:text-gray-600" aria-label="Close">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <p class="mb-4 text-sm text-gray-500">{{ data.dayLabel }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
    <div>
      <label class="mb-1 block text-xs font-medium text-gray-600">Patient name</label>
      <input
        formControlName="patientName"
        type="text"
        class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-primary focus:outline-none"
      />
    </div>

    <div>
      <label class="mb-1 block text-xs font-medium text-gray-600">Reason</label>
      <input
        formControlName="reason"
        type="text"
        class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-primary focus:outline-none"
      />
    </div>

    <div class="flex gap-3">
      <div class="flex-1">
        <label class="mb-1 block text-xs font-medium text-gray-600">Time</label>
        <input
          formControlName="time"
          type="time"
          class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-primary focus:outline-none"
        />
      </div>
      <div class="flex-1">
        <label class="mb-1 block text-xs font-medium text-gray-600">Duration (min)</label>
        <input
          formControlName="durationMinutes"
          type="number"
          min="5"
          step="5"
          class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-primary focus:outline-none"
        />
      </div>
    </div>

    <div>
      <label class="mb-1 block text-xs font-medium text-gray-600">Priority</label>
      <select
        formControlName="priority"
        class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-primary focus:outline-none"
      >
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
        <option value="urgent">Urgent</option>
      </select>
    </div>

    <div>
      <label class="mb-1 block text-xs font-medium text-gray-600">Doctor (optional)</label>
      <input
        formControlName="doctor"
        type="text"
        class="w-full rounded-lg border border-gray-200 px-3 py-2 text-sm focus:border-primary focus:outline-none"
      />
    </div>

    <div class="mt-5 flex justify-end gap-2">
      <button
        type="button"
        (click)="close()"
        class="rounded-lg border border-gray-200 px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50"
      >
        Cancel
      </button>
      <button type="submit" class="rounded-lg bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-primary/90">
        Create Appointment
      </button>
    </div>
  </form>
</div>
