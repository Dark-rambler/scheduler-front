<div class="glass-modal w-[24rem] rounded-3xl p-6">
  <h2 class="text-lg font-extrabold text-gray-900">{{ data.title }}</h2>
  <p class="mt-2 text-sm font-medium text-gray-500">{{ data.message }}</p>

  <div class="mt-6 flex justify-end gap-2.5">
    <button
      type="button"
      (click)="close(false)"
      class="glass-panel rounded-2xl px-5 py-2.5 text-sm font-bold text-gray-700 transition-colors hover:bg-white/70"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="close(true)"
      class="rounded-2xl bg-red-600 px-5 py-2.5 text-sm font-bold text-white shadow-lg shadow-red-600/30 transition-colors hover:bg-red-600/90"
    >
      {{ data.confirmLabel }}
    </button>
  </div>
</div>
