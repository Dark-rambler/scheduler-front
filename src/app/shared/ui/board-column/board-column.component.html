<div class="flex shrink-0 items-center gap-2 border-b border-gray-100 px-4 py-3">
  <span class="h-2 w-2 rounded-full" [class]="column().accentClass"></span>
  <h2 class="text-sm font-semibold text-gray-700">{{ column().title }}</h2>
  <span class="ml-auto rounded-full bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-500">
    {{ column().appointments.length }}
  </span>
</div>

<div
  cdkDropList
  [id]="column().id"
  [cdkDropListData]="column().appointments"
  (cdkDropListDropped)="dropped.emit($event)"
  class="flex min-h-0 flex-1 flex-col gap-3 overflow-y-auto rounded-b-xl bg-gray-50/60 p-3"
>
  @for (appointment of column().appointments; track appointment.id) {
    <app-board-card cdkDrag [appointment]="appointment" />
  } @empty {
    <div class="flex flex-1 items-center justify-center rounded-lg border border-dashed border-gray-200 py-6 text-xs text-gray-400">
      No appointments
    </div>
  }
</div>
