<button
  type="button"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  (click)="toggle()"
  [attr.aria-label]="label()"
  class="flex w-full items-center gap-2.5 rounded-2xl border border-gray-900/10 bg-gray-900/[0.04] px-3 py-2 text-left text-sm font-semibold text-gray-700 shadow-[inset_0_1px_3px_rgba(0,0,0,0.08)] transition-colors hover:bg-gray-900/[0.07] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/30 {{ isOpen() ? 'border-primary/40 bg-white ring-2 ring-primary/30' : '' }}"
>
  <svg class="h-4 w-4 shrink-0 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M8 2v4M16 2v4M3.5 9h17M4 4.5h16A1.5 1.5 0 0 1 21.5 6v14A1.5 1.5 0 0 1 20 21.5H4A1.5 1.5 0 0 1 2.5 20V6A1.5 1.5 0 0 1 4 4.5Z" />
  </svg>
  <span class="min-w-0 flex-1 truncate">{{ display() }}</span>
  <svg class="h-3.5 w-3.5 shrink-0 text-gray-400 transition-transform {{ isOpen() ? 'rotate-180' : '' }}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
    <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
  </svg>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayPositions]="positions"
  (overlayOutsideClick)="close()"
  (detach)="close()"
>
  <div class="glass-modal w-[19rem] rounded-3xl p-4">
    <div class="mb-3 flex items-center justify-between">
      <button type="button" (click)="previousMonth()" class="flex h-8 w-8 items-center justify-center rounded-xl text-gray-600 transition-colors hover:bg-white/60" aria-label="Previous month">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6" /></svg>
      </button>
      <p class="text-sm font-extrabold text-gray-900">{{ monthLabel() }}</p>
      <button type="button" (click)="nextMonth()" class="flex h-8 w-8 items-center justify-center rounded-xl text-gray-600 transition-colors hover:bg-white/60" aria-label="Next month">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6" /></svg>
      </button>
    </div>

    <div class="mb-1.5 grid grid-cols-7 text-center text-[11px] font-bold tracking-wide text-gray-400">
      @for (weekday of weekdayLabels; track $index) {
        <span>{{ weekday }}</span>
      }
    </div>

    <div class="grid grid-cols-7 gap-y-1">
      @for (week of weeks(); track $index) {
        @for (day of week; track day.iso) {
          <button
            type="button"
            [disabled]="isDisabled(day)"
            (click)="pick(day)"
            class="mx-auto flex h-9 w-9 items-center justify-center rounded-full text-[13px] font-semibold transition-colors disabled:cursor-not-allowed {{
              day.iso === value()
                ? 'bg-primary font-bold text-white shadow-md shadow-primary/30'
                : isDisabled(day)
                  ? 'text-gray-300'
                  : day.iso === today
                    ? 'font-extrabold text-primary ring-1 ring-primary/30 hover:bg-white/70'
                    : day.inCurrentMonth
                      ? 'text-gray-700 hover:bg-white/70'
                      : 'text-gray-300 hover:bg-white/40'
            }}"
          >
            {{ day.date.getDate() }}
          </button>
        }
      }
    </div>
  </div>
</ng-template>
