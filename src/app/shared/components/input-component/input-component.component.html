<div class="my-2">
  <label [ngClass]="{ required: isRequired() }" for="input">{{
    label()
  }}</label>
  <input
    [type]="type()"
    class="w-full p-2 border rounded"
    [ngClass]="errorMessage ? 'border-red-500' : 'border-neutral-400'"
    [placeholder]="placeholder()"
    [formControl]="control"
  />
  @if (errorMessage) {
    <p class="text-red-500 text-sm mt-1">{{ errorMessage }}</p>
  }
</div>
