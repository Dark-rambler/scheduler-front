<div class="flex h-screen bg-neutral">
  <!-- Sidebar -->
  <aside class="flex w-60 shrink-0 flex-col border-r border-gray-200 bg-white">
    <div class="flex items-center gap-2 px-5 py-5">
      <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-primary text-sm font-bold text-white">CC</div>
      <div>
        <p class="text-sm font-semibold text-gray-900">Central Clinic</p>
        <p class="text-xs text-gray-500">Oncology Dept</p>
      </div>
    </div>

    <nav class="flex-1 space-y-1 px-3 py-2">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-primary/10 text-primary"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            @switch (item.icon) {
              @case ('board') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v18M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" />
              }
              @case ('calendar') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 2v4M16 2v4M3.5 9h17M4 4.5h16A1.5 1.5 0 0 1 21.5 6v14A1.5 1.5 0 0 1 20 21.5H4A1.5 1.5 0 0 1 2.5 20V6A1.5 1.5 0 0 1 4 4.5Z" />
              }
              @case ('patients') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 5 18.5V20M11.5 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM19 20v-1.5a3 3 0 0 0-2.2-2.9M15.5 4.6a3 3 0 0 1 0 5.8" />
              }
              @case ('analytics') {
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 20V10M11 20V4M18 20v-6" />
              }
            }
          </svg>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="space-y-1 border-t border-gray-200 px-3 py-3">
      <a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2 1.7-2 3.2M12 16.5h.01" />
        </svg>
        Support
      </a>
      <a href="#" class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9" />
        </svg>
        Logout
      </a>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex items-center justify-between border-b border-gray-200 bg-white px-6 py-3">
      <p class="text-lg font-semibold text-primary">ClinicFlow</p>

      <div class="relative w-80">
        <svg class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.3-4.3M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" />
        </svg>
        <input
          type="text"
          placeholder="Search..."
          class="w-full rounded-lg border border-gray-200 bg-gray-50 py-2 pl-9 pr-3 text-sm text-gray-700 placeholder:text-gray-400 focus:border-primary focus:outline-none"
        />
      </div>

      <div class="flex items-center gap-4">
        <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3a4 4 0 0 0-4 4v3.3c0 .5-.2 1-.5 1.4L6 14h12l-1.5-2.3a2.3 2.3 0 0 1-.5-1.4V7a4 4 0 0 0-4-4ZM10 17a2 2 0 0 0 4 0" />
        </svg>
        <svg class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM19.4 15a1.65 1.65 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.65 1.65 0 0 0-1.8-.3 1.65 1.65 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.65 1.65 0 0 0-1-1.5 1.65 1.65 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.65 1.65 0 0 0 .3-1.8 1.65 1.65 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.65 1.65 0 0 0 1.5-1 1.65 1.65 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.65 1.65 0 0 0 1.8.3H9a1.65 1.65 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.65 1.65 0 0 0 1 1.5 1.65 1.65 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.65 1.65 0 0 0-.3 1.8V9a1.65 1.65 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.65 1.65 0 0 0-1.5 1Z" />
        </svg>
        <div class="h-8 w-8 rounded-full bg-primary/10 text-center text-sm font-semibold leading-8 text-primary">A</div>
      </div>
    </header>

    <main class="flex min-h-0 flex-1 flex-col overflow-hidden p-6">
      <router-outlet />
    </main>
  </div>
</div>
